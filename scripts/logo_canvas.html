<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1024px;
      height: 1024px;
      background: #08090c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 1024px;
      height: 1024px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #141720 0%, #0c0e14 55%, #06070a 100%);
    }

    /* Ambient glow behind seal */
    .glow-gold {
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, rgba(16, 185, 129, 0.06) 40%, transparent 70%);
      filter: blur(40px);
      pointer-events-none;
    }

    svg {
      width: 920px;
      height: 920px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow-gold"></div>
    <svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gold Gradient - High Polish -->
        <linearGradient id="goldPolish" x1="150" y1="150" x2="850" y2="850" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fffbeb" />
          <stop offset="25%" stop-color="#f59e0b" />
          <stop offset="50%" stop-color="#d97706" />
          <stop offset="75%" stop-color="#92400e" />
          <stop offset="100%" stop-color="#fbbf24" />
        </linearGradient>

        <linearGradient id="goldBeam" x1="200" y1="360" x2="800" y2="360" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f59e0b" />
          <stop offset="50%" stop-color="#fef3c7" />
          <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <linearGradient id="emeraldCore" x1="450" y1="520" x2="550" y2="680" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#34d399" />
          <stop offset="50%" stop-color="#10b981" />
          <stop offset="100%" stop-color="#047857" />
        </linearGradient>

        <linearGradient id="darkSlate" x1="0" y1="0" x2="1000" y2="1000" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#161922" />
          <stop offset="100%" stop-color="#0d0f15" />
        </linearGradient>

        <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
        </filter>

        <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="14" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Background Circular Seal Plate -->
      <circle cx="500" cy="500" r="460" fill="url(#darkSlate)" stroke="#232838" stroke-width="3" filter="url(#shadowHeavy)" />
      
      <!-- Outer Notarized Coin Edge Rings -->
      <circle cx="500" cy="500" r="445" stroke="url(#goldPolish)" stroke-width="2.5" opacity="0.85" />
      <circle cx="500" cy="500" r="415" stroke="#2a3042" stroke-width="1.5" />
      
      <!-- Decorative Astrolabe Ticks (72 radial notches) -->
      <g opacity="0.65">
        <circle cx="500" cy="500" r="430" stroke="#f59e0b" stroke-width="4" stroke-dasharray="3 15.7" />
      </g>

      <!-- Inner Docket Seal Border -->
      <circle cx="500" cy="500" r="380" stroke="url(#goldPolish)" stroke-width="2" opacity="0.9" />
      <circle cx="500" cy="500" r="372" stroke="#10b981" stroke-width="1" opacity="0.4" />

      <!-- Circular Text Tracks -->
      <!-- Top Arc -->
      <path id="textCircleTop" d="M 180,500 A 320,320 0 0,1 820,500" fill="none" />
      <!-- Bottom Arc: sweeping left-to-right along bottom circle -->
      <path id="textCircleBottom" d="M 175,500 A 325,325 0 0,0 825,500" fill="none" />

      <text font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="25" font-weight="bold" fill="#f59e0b" letter-spacing="10" opacity="0.95">
        <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
          LEXIPACT PROTOCOL
        </textPath>
      </text>

      <text font-family="'JetBrains Mono', 'Courier', monospace" font-size="17" font-weight="700" fill="#cbd5e1" letter-spacing="7" opacity="0.9">
        <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
          BASE L2 &bull; EIP-712 &bull; AI ESCROW
        </textPath>
      </text>

      <!-- Sacred Circuit Geometry & Security Grid -->
      <g opacity="0.25">
        <!-- Octagonal Security Vault Wireframe -->
        <polygon points="500,190 719,281 810,500 719,719 500,810 281,719 190,500 281,281" stroke="#f59e0b" stroke-width="1" fill="none" />
        <polygon points="500,225 694,306 775,500 694,694 500,775 306,694 225,500 306,306" stroke="#10b981" stroke-width="0.8" fill="none" stroke-dasharray="4 8" />
      </g>

      <!-- CENTRAL EMBLEM: PILLAR, BALANCE BEAM, AND AI SHIELD -->
      <g filter="url(#goldGlow)">
        <!-- Top Crown / Legal Apex -->
        <polygon points="500,270 520,305 480,305" fill="url(#goldPolish)" />
        <circle cx="500" cy="265" r="12" fill="#fffbeb" stroke="#d97706" stroke-width="3" />
        <circle cx="500" cy="265" r="5" fill="#10b981" />

        <!-- Capital Head of Pillar -->
        <path d="M 430,325 L 570,325 L 555,345 L 445,345 Z" fill="url(#goldPolish)" />
        <rect x="420" y="315" width="160" height="10" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />

        <!-- Master Balance Crossbeam -->
        <path d="M 230,345 C 330,335 430,340 500,340 C 570,340 670,335 770,345 L 775,355 C 670,348 570,350 500,350 C 430,350 330,348 225,355 Z" fill="url(#goldBeam)" />
        
        <!-- Left & Right Pivot Rings -->
        <circle cx="230" cy="350" r="14" fill="#161922" stroke="url(#goldPolish)" stroke-width="3" />
        <circle cx="230" cy="350" r="5" fill="#f59e0b" />
        <circle cx="770" cy="350" r="14" fill="#161922" stroke="url(#goldPolish)" stroke-width="3" />
        <circle cx="770" cy="350" r="5" fill="#f59e0b" />

        <!-- Center Pillar Shaft (Double Architectural Fluting) -->
        <path d="M 480,345 L 480,690 L 520,690 L 520,345 Z" fill="#11141c" stroke="url(#goldPolish)" stroke-width="2.5" />
        <line x1="492" y1="355" x2="492" y2="680" stroke="#f59e0b" stroke-width="1.5" opacity="0.7" />
        <line x1="508" y1="355" x2="508" y2="680" stroke="#f59e0b" stroke-width="1.5" opacity="0.7" />

        <!-- Pillar Base Pedestal -->
        <path d="M 440,690 L 560,690 L 580,715 L 420,715 Z" fill="url(#goldPolish)" />
        <rect x="400" y="715" width="200" height="16" rx="4" fill="#1c202b" stroke="url(#goldPolish)" stroke-width="2" />
      </g>

      <!-- SCALES SUSPENSION CHAINS AND PANS -->
      <!-- Left Pan -->
      <g>
        <line x1="230" y1="364" x2="160" y2="520" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3" />
        <line x1="230" y1="364" x2="300" y2="520" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3" />
        
        <!-- Pan Body -->
        <path d="M 140,520 Q 230,590 320,520 L 315,515 Q 230,575 145,515 Z" fill="url(#goldPolish)" filter="url(#shadowHeavy)" />
        <!-- On-Chain Tokens on Left Pan (Client Capital Locked) -->
        <circle cx="230" cy="510" r="18" fill="#10b981" stroke="#fef3c7" stroke-width="2.5" opacity="0.95" />
        <text x="230" y="516" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#08090c" text-anchor="middle">ETH</text>
      </g>

      <!-- Right Pan -->
      <g>
        <line x1="770" y1="364" x2="700" y2="520" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3" />
        <line x1="770" y1="364" x2="840" y2="520" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3" />
        
        <!-- Pan Body -->
        <path d="M 680,520 Q 770,590 860,520 L 855,515 Q 770,575 685,515 Z" fill="url(#goldPolish)" filter="url(#shadowHeavy)" />
        <!-- Verified Deliverable Code on Right Pan -->
        <polygon points="770,490 790,502 790,524 770,536 750,524 750,502" fill="#3b82f6" stroke="#fef3c7" stroke-width="2.5" />
        <text x="770" y="518" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
      </g>

      <!-- CENTRAL AUTONOMOUS AI ORACLE SHIELD -->
      <g filter="url(#shadowHeavy)">
        <!-- Shield Outer Frame -->
        <path d="M 500,430 L 590,470 L 590,570 Q 590,670 500,720 Q 410,670 410,570 L 410,470 Z" fill="#0d1017" stroke="url(#goldPolish)" stroke-width="6" />
        
        <!-- Shield Inner Emerald Glow Core -->
        <path d="M 500,448 L 572,480 L 572,562 Q 572,646 500,694 Q 428,646 428,562 L 428,480 Z" fill="url(#emeraldCore)" opacity="0.9" filter="url(#emeraldGlow)" />
        
        <!-- Stylized Checkmark of Compliance Verification -->
        <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="465,565 492,592 545,530" fill="none" />
        </g>
        
        <!-- Small Cryptographic Node in Shield Peak -->
        <circle cx="500" cy="485" r="8" fill="#fffbeb" />
        <circle cx="500" cy="485" r="3" fill="#047857" />
      </g>
    </svg>
  </div>
</body>
</html>
